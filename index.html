<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股 360 度投資儀表板</title>
    <!-- 替換為更穩定的 jsdelivr CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased p-4">

    <!-- 控制面板 -->
    <div class="max-w-7xl mx-auto mb-4 bg-gray-800 p-4 rounded-lg shadow-lg flex flex-wrap gap-4 items-center justify-between border border-gray-700">
        <div class="flex items-center gap-3">
            <input type="text" id="stock-input" placeholder="輸入代號 (例: 3034)" class="bg-gray-700 text-white px-3 py-2 rounded border border-gray-600 focus:outline-none focus:border-blue-500 w-40">
            <button onclick="addStock()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded transition">新增持股</button>
        </div>
        <button onclick="removeCurrentStock()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded transition">刪除當前標的</button>
    </div>

    <!-- 持股標籤切換區 -->
    <div class="max-w-7xl mx-auto mb-4 flex gap-2 overflow-x-auto pb-2" id="stock-tabs"></div>

    <!-- 主圖表區 -->
    <div class="max-w-7xl mx-auto bg-gray-800 rounded-lg shadow-lg overflow-hidden border border-gray-700">
        <div class="p-4 border-b border-gray-700 flex justify-between items-center">
            <h1 id="current-stock-title" class="text-2xl font-bold text-blue-400">系統初始化中...</h1>
            <div id="loading-indicator" class="text-gray-400 text-sm hidden">讀取試算表資料中...</div>
        </div>
        <div id="tv-chart" class="w-full h-[550px]"></div>
    </div>

    <script>
        // 1. 您的 Google Sheets CSV 網址
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlxh0oSXvWHidrlyMLR0KXtVdByd7NoLYSLOHCTuV2Y4XcuaF8LReD_8uqziTJ0HxFf-S6ZUR_XLfx/pub?gid=1810855279&single=true&output=csv';
        
        // 2. 防呆機制：安全讀取 localStorage
        let trackedStocks;
        try {
            trackedStocks = JSON.parse(localStorage.getItem('myStocks'));
            if (!Array.isArray(trackedStocks) || trackedStocks.length === 0) throw new Error("Invalid format");
        } catch (e) {
            trackedStocks = ['3034'];
            localStorage.setItem('myStocks', JSON.stringify(trackedStocks));
        }
        let currentStock = trackedStocks[0];
        let globalCsvData = [];

        // 3. 圖表初始化 (加入防錯機制)
        let chart, candlestickSeries, volumeSeries;
        try {
            const chartOptions = {
                layout: { textColor: '#d1d5db', background: { type: 'solid', color: '#1f2937' } },
                grid: { vertLines: { color: '#374151', style: 1 }, horzLines: { color: '#374151', style: 1 } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { borderColor: '#4b5563', timeVisible: true }
            };
            chart = LightweightCharts.createChart(document.getElementById('tv-chart'), chartOptions);
            candlestickSeries = chart.addCandlestickSeries({ upColor: '#ef4444', downColor: '#22c55e', borderVisible: false, wickUpColor: '#ef4444', wickDownColor: '#22c55e' });
            volumeSeries = chart.addHistogramSeries({ color: '#3b82f6', priceFormat: { type: 'volume' }, priceScaleId: '', scaleMargins: { top: 0.8, bottom: 0 } });
        } catch (error) {
            console.error("TradingView 核心載入失敗:", error);
            document.getElementById('current-stock-title').innerText = "圖表核心載入失敗，請檢查網路狀態。";
        }

        // 4. 強制日期格式轉換器 (確保 TradingView 不崩潰)
        function formatSafeDate(dateStr) {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return null;
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // 5. 渲染標籤
        function renderTabs() {
            const tabsContainer = document.getElementById('stock-tabs');
            tabsContainer.innerHTML = '';
            trackedStocks.forEach(stock => {
                const btn = document.createElement('button');
                btn.innerText = stock;
                btn.className = `px-6 py-2 rounded-full text-sm font-bold transition flex-shrink-0 ${stock === currentStock ? 'bg-blue-500 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`;
                btn.onclick = () => { currentStock = stock; renderTabs(); updateChartWithFilteredData(); };
                tabsContainer.appendChild(btn);
            });
        }

        function addStock() {
            const input = document.getElementById('stock-input');
            const newStock = input.value.trim();
            if (newStock && !trackedStocks.includes(newStock)) {
                trackedStocks.push(newStock);
                localStorage.setItem('myStocks', JSON.stringify(trackedStocks));
                input.value = '';
                currentStock = newStock;
                renderTabs();
                updateChartWithFilteredData();
            }
        }

        function removeCurrentStock() {
            if (trackedStocks.length <= 1) { alert("至少需要保留一檔標的！"); return; }
            trackedStocks = trackedStocks.filter(s => s !== currentStock);
            localStorage.setItem('myStocks', JSON.stringify(trackedStocks));
            currentStock = trackedStocks[0];
            renderTabs();
            updateChartWithFilteredData();
        }

        // 6. 過濾與渲染資料 (加入去重與排序)
        function updateChartWithFilteredData() {
            if (!chart) return; 
            
            const stockData = globalCsvData.filter(row => String(row.stockId) === String(currentStock));
            
            if (stockData.length === 0) {
                candlestickSeries.setData([]);
                volumeSeries.setData([]);
                document.getElementById('current-stock-title').innerText = `代號：${currentStock} (試算表中無此資料)`;
                return;
            }

            // 嚴格依照日期排序並去重 (TradingView 重複時間會當機)
            stockData.sort((a, b) => new Date(a.time) - new Date(b.time));
            const uniqueData = [];
            let lastTime = "";
            stockData.forEach(d => {
                if (d.time !== lastTime) { uniqueData.push(d); lastTime = d.time; }
            });

            try {
                candlestickSeries.setData(uniqueData.map(d => ({ time: d.time, open: d.open, high: d.high, low: d.low, close: d.close })));
                volumeSeries.setData(uniqueData.map(d => ({ 
                    time: d.time, value: d.volume, 
                    color: d.close >= d.open ? 'rgba(239, 68, 68, 0.5)' : 'rgba(34, 197, 94, 0.5)' 
                })));
                chart.timeScale().fitContent();
                document.getElementById('current-stock-title').innerText = `代號：${currentStock}`;
            } catch (error) {
                console.error("資料寫入圖表失敗:", error);
                document.getElementById('current-stock-title').innerText = `資料格式異常，無法渲染。`;
            }
        }

        // 7. 讀取 Google Sheets 資料
        async function fetchGoogleSheetsData() {
            document.getElementById('loading-indicator').classList.remove('hidden');
            document.getElementById('current-stock-title').innerText = "讀取試算表中...";
            try {
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error("網路請求失敗");
                
                const csvText = await response.text();
                const rows = csvText.trim().split('\n').slice(1);
                globalCsvData = [];

                rows.forEach(row => {
                    const cols = row.split(',').map(item => item.trim());
                    if (cols.length >= 7 && cols[0] !== '') {
                        const safeDate = formatSafeDate(cols[0]);
                        if (safeDate) {
                            globalCsvData.push({
                                time: safeDate, stockId: cols[1], open: parseFloat(cols[2]),
                                high: parseFloat(cols[3]), low: parseFloat(cols[4]),
                                close: parseFloat(cols[5]), volume: parseFloat(cols[6])
                            });
                        }
                    }
                });
                updateChartWithFilteredData();
            } catch (error) {
                console.error("CSV 解析失敗", error);
                document.getElementById('current-stock-title').innerText = "讀取失敗，請確認 Google 試算表權限或內容。";
                alert("資料讀取失敗，請檢查網頁主控台 (F12) 錯誤訊息。");
            } finally {
                document.getElementById('loading-indicator').classList.add('hidden');
            }
        }

        // 啟動系統
        renderTabs();
        fetchGoogleSheetsData();

        window.addEventListener('resize', () => {
            if (chart) chart.resize(document.getElementById('tv-chart').clientWidth, 550);
        });
    </script>
</body>
</html>
